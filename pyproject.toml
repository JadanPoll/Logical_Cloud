[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logical-cloud"
version = "0.1.0"
description = "Factorized placement and execution simulator for logically location-independent applications"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
logical-cloud = "logical_cloud.cli:main"

[tool.setuptools.packages.find]
include = ["logical_cloud*"]
