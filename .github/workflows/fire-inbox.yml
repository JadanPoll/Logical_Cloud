name: Fire Inbox contract
on:
  pull_request:
    paths:
      - 'apps/fire-inbox/**'
      - '.github/workflows/fire-inbox.yml'
  push:
    branches: [main]
    paths:
      - 'apps/fire-inbox/**'
      - '.github/workflows/fire-inbox.yml'

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate Node syntax
        working-directory: apps/fire-inbox
        run: |
          for f in api/*.js api/messages/*.js lib/*.js tests/*.js; do node --check "$f"; done
      - name: Test protocol
        working-directory: apps/fire-inbox
        run: node --test tests/*.test.js
